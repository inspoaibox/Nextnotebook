<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 布局测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #f5f5f5;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .conversation-item {
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .conversation-item:hover {
      background: #e6f4ff;
    }

    .conversation-item.active {
      background: #e6f4ff;
      border-left: 3px solid #1890ff;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .toolbar {
      padding: 8px 16px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fafafa;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1890ff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: #52c41a;
    }

    .message-content {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      margin: 0 12px;
    }

    .message.user .message-content {
      background: #1890ff;
      color: white;
    }

    .message.assistant .message-content {
      background: white;
      color: #333;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
      background: white;
    }

    .input-container {
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      resize: none;
      font-family: inherit;
      font-size: 14px;
    }

    textarea:focus {
      outline: none;
      border-color: #1890ff;
    }

    button {
      padding: 8px 16px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #40a9ff;
    }

    button:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }

    .highlight {
      border: 3px solid red !important;
      background: yellow !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button onclick="createConversation()">+ 新对话</button>
      </div>
      <div class="sidebar-content" id="conversations">
        <div class="conversation-item active">测试对话 1</div>
        <div class="conversation-item">测试对话 2</div>
      </div>
    </div>

    <!-- 右侧主区域 -->
    <div class="main-area">
      <!-- 工具栏 -->
      <div class="toolbar">
        <span style="font-weight: 500;">🤖 智能助理</span>
        <div style="flex: 1;"></div>
        <select style="padding: 4px 8px;">
          <option>GPT-4</option>
          <option>GPT-3.5</option>
        </select>
      </div>

      <!-- 消息区域 -->
      <div class="messages-area" id="messages">
        <div class="message user">
          <div class="message-avatar">U</div>
          <div class="message-content">你好，这是一条测试消息</div>
        </div>
        <div class="message assistant">
          <div class="message-avatar">AI</div>
          <div class="message-content">你好！我是 AI 助手，很高兴为你服务。</div>
        </div>
      </div>

      <!-- 输入区域 - 应该始终可见 -->
      <div class="input-area" id="inputArea">
        <div class="input-container">
          <textarea 
            id="messageInput" 
            placeholder="输入消息，按 Enter 发送，Shift+Enter 换行"
            rows="1"
          ></textarea>
          <button onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 高亮输入区域
    setTimeout(() => {
      const inputArea = document.getElementById('inputArea');
      const textarea = document.getElementById('messageInput');
      
      console.log('输入区域:', inputArea);
      console.log('输入框:', textarea);
      console.log('输入区域位置:', inputArea.getBoundingClientRect());
      console.log('输入框位置:', textarea.getBoundingClientRect());
      
      // 高亮显示
      inputArea.style.border = '3px solid red';
      textarea.classList.add('highlight');
    }, 1000);

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      const messagesArea = document.getElementById('messages');
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `
        <div class="message-avatar">U</div>
        <div class="message-content">${message}</div>
      `;
      messagesArea.appendChild(userMsg);
      messagesArea.scrollTop = messagesArea.scrollHeight;

      input.value = '';
    }

    function createConversation() {
      const conversationsArea = document.getElementById('conversations');
      const newConv = document.createElement('div');
      newConv.className = 'conversation-item';
      newConv.textContent = '新对话 ' + (conversationsArea.children.length + 1);
      conversationsArea.appendChild(newConv);
    }

    // 支持 Enter 发送
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
